{% extends "base.html" %}
{% block content %}
<h2>Профиль</h2>
<form method="post">
  <div class="row">
    <div class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Имя</label>
        <input class="form-control" name="first_name" value="{{ user.first_name or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Фамилия</label>
        <input class="form-control" name="last_name" value="{{ user.last_name or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Телефон</label>
        <input class="form-control" name="phone" value="{{ user.phone or '' }}">
      </div>
    </div>
    <div class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Компания</label>
        <input class="form-control" name="company_name" value="{{ user.company_name or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Адрес</label>
        <input class="form-control" name="address" value="{{ user.address or '' }}">
      </div>
        {% if allow_credentials_edit %}
        <div class="mb-3">
          <label class="form-label">Имя пользователя</label>
          <input class="form-control" name="username" value="{{ user.username or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" name="email" value="{{ user.email or '' }}">
        </div>
        {% else %}
        <div class="mb-3">
          <label class="form-label">Email (не редактируется)</label>
          <input class="form-control" value="{{ user.email }}" disabled>
        </div>
        {% endif %}
    </div>
  </div>
  <button class="btn btn-primary">Сохранить</button>
  <a class="btn btn-secondary" href="{{ url_for('dashboard') }}">Отмена</a>
</form>
{% endblock %}
